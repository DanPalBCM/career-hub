project:
  type: website
  output-dir: _site

website:
  title: "Daniel Palacios"
  site-url: https://danpalbcm.github.io/career-hub/
  repo-url: https://github.com/DanPalBCM/career-hub
  description: >-
    Publications, research software, and CV for Daniel Palacios, Ph.D.
    candidate in Quantitative and Computational Biosciences at Baylor College
    of Medicine.
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: publications.qmd
        text: Publications
      - href: software.qmd
        text: Software
      - href: career.qmd
        text: Career
      # PERSONAL — private flag: uncomment to display personal tabs on the website
      # - href: travels.qmd
      #   text: Travels
      - href: assets/cv/cv-latest.pdf
        text: CV (PDF)
    right:
      - icon: github
        href: https://github.com/DanPalBCM
        aria-label: GitHub
  page-footer:
    left: "Daniel.Palacios@bcm.edu · Content licensed CC BY 4.0"
    right:
      - icon: github
        href: https://github.com/DanPalBCM
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/daniel-palacios-506734224/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:Daniel.Palacios@bcm.edu
        aria-label: Email
      - text: ORCID
        href: https://orcid.org/0000-0001-9608-3311
        aria-label: ORCID

format:
  html:
    theme:
      light: [cosmo, styles/light.scss]
      dark: [cosmo, styles/dark.scss]
    toc: true
    toc-depth: 2
    anchor-sections: true
    link-external-newwindow: true
    grid:
      body-width: 900px

# Bibliographies are set per page (publications.qmd, software.qmd) so each
# page reads only its own canonical .bib file.
link-citations: true
