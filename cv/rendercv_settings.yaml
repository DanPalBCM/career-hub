# cv/rendercv_settings.yaml — PRESENTATION ONLY.
# Passed to RenderCV as the design file:
#   rendercv render cv/cv.yaml --design cv/rendercv_settings.yaml
# Content lives in cv/cv.yaml. Nothing in this file should change what the CV
# says — only how it looks.
#
# Validated against RenderCV 2.8 (pinned in .github/workflows/build.yml).
# The design schema changed substantially after 2.2: page/show_page_numbering
# became page/show_footer, text.* moved under typography.*, header connection
# options moved under header/connections, etc. If the RenderCV pin is bumped,
# re-validate with: rendercv render cv/cv.yaml --design cv/rendercv_settings.yaml

design:
  theme: classic

  page:
    size: us-letter
    top_margin: 2cm
    bottom_margin: 2cm
    left_margin: 1.8cm
    right_margin: 1.8cm
    show_footer: true
    show_top_note: true

  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    section_titles: rgb(0, 79, 144)
    connections: rgb(0, 79, 144)
    links: rgb(0, 79, 144)

  typography:
    font_family: Source Sans 3
    font_size:
      name: 26pt
      section_titles: 1.2em
    small_caps:
      section_titles: false
    line_spacing: 0.6em
    alignment: justified

  links:
    underline: false
    show_external_link_icon: false

  header:
    alignment: center
    connections:
      separator: " | "
      show_icons: true

  section_titles:
    type: with_partial_line

  entries:
    date_and_location_width: 4.5cm
    allow_page_break: false
    highlights:
      bullet: "-"
      space_above: 0.2cm
      space_left: 0.4cm
