    summary:
      - >-
        Ph.D. candidate in Quantitative and Computational Biosciences and NSF
        Graduate Research Fellow applying AI and machine learning — LLM-powered
        agentic systems, multi-agent architectures, and EHR foundation models —
        to clinical informatics and computational biology. Prior research in
        space radiation biology and NLP at NASA, and in theoretical
        superconductivity.

    education:
