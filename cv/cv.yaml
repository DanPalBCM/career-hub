        start_date: 2018
        end_date: 2022
        highlights:
          - "GPA 3.95/4.00, magna cum laude"
          - "Dean's Distinguished Scholar (2018-2022)"

    experience:
      - company: Peraton
        position: AI Developer and Research Design Intern
        location: Reston, VA (Remote)
        start_date: 2026-08
        highlights:
          - "Cyber Operations, Cyber and Intelligence Sector; mentor Ebenezer Dadson."
          - "Building software powered by large language models and multi-agent systems."
          - >-
            Designing evaluation protocols and controlled experiments measuring
            how design parameters and system factors affect performance and
            reliability.

      - company: Baylor College of Medicine
        position: Graduate Student Researcher
        location: Houston, TX
        start_date: 2022
        highlights:
          - >-
            Liu Lab, Data Science Center, Duncan Neurological Research Institute,
            Texas Children's Hospital; advisor Dr. Zhandong Liu.
          - >-
            ClinPreAI: agentic AI system (research, planning, coding, debugging,
            and interpretation modules) for early postpartum depression risk
            prediction (EPDS >= 10, 31% prevalence) from a single antepartum
            hospitalization; 4,161 patients, 27 structured variables plus social
            worker notes; F1 0.68 structured / 0.65 multimodal, matching a custom
            LLM-XGBoost pipeline.
          - >-
            Pediatric diabetes (T1D/T2D): PySpark pipeline on Palantir Foundry
            built from OMOP CDM and Epic Clarity EHR data; T2D n=2,489,
            T1D n=4,018; 7 binary outcomes at 2- and 5-year horizons;
            multi-agent LLM clinical-reasoning architectures compared against
            8 classical machine-learning and deep-learning baselines.
          - >-
            Trofinetide / Rett syndrome: dual-LLM consensus pipeline extracting
            18 treatment-response phenotypes from 26,763 notes (108 patients);
            84.2% accuracy and F1 0.674 on the expert-annotated development set.
          - >-
            Clinical-note de-identification: benchmarked 8 LLMs against Stanford
            TiDE, OpenMed PII, and pattern baselines on 100 expert-annotated
            pediatric oncology notes (5,322 PHI spans); best single-pass
            F1 0.918 +/- 0.001; introduced "institutionally-situated PHI"; used
            LLM outputs to surface 414 candidate gold-standard annotation gaps.
          - >-
            TEDDY: contributed to a 1.84M-parameter generative pediatric EHR
            foundation model trained on approximately 1.6M children and 73M
            ICD-10 codes; median first-occurrence AUC 0.72 across 797
            disease-onset tasks.

      - company: NASA Ames Research Center
        position: Research Associate
        location: Mountain View, CA
        start_date: 2022-05
        end_date: 2022-08
        highlights:
          - "Space Biosciences Division; mentor Dr. Jessica Lee. Collaboration continued remotely through August 2026."
          - >-
            Developed the AMMPER model simulating cell damage under space
            radiation, validated against BioSentinel mission data.
          - >-
            Added gamma radiation and alamarBlue metabolic-dye dynamics
            (Michaelis-Menten kinetics) and a 3D free-radical diffusion model.
          - "Mentored two undergraduates who carried the project forward; 4 presentations."

      - company: NASA Johnson Space Center
        position: Machine Learning Researcher Intern
        location: Houston, TX
        start_date: 2021
        end_date: 2022
        highlights:
          - "Mentor Terry Hill."
          - >-
            Built an NLP pipeline over historical engineering failure reports and
            an LDA-BERT taxonomy for space-hardware failure reporting.
          - >-
            Delivered Power BI dashboards and interactive knowledge graphs
            (INDRA-EIDOS, spaCy, Bokeh-networkx).
          - "Identified 5-15 critical engineering processes; 8 presentations."

      - company: University of Houston
        position: Undergraduate Researcher
        location: Houston, TX
        start_date: 2020
        end_date: 2021
        highlights:
          - "Advisor Dr. Pavan Hosur."
          - >-
            Theoretical work on asymmetric superconductivity under broken
            symmetries; modeled asymmetric supercurrents in non-centrosymmetric
            superconductors.
          - "1 conference presentation; 1 Physical Review B publication."

