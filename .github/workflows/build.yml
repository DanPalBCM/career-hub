# Render the website (Quarto), then deploy to gh-pages.
#
# Note: the CV PDFs under assets/cv/ are Daniel's own LaTeX-compiled CV,
# committed directly as source files. They are NOT rendered in CI.
# (RenderCV was used for an earlier CV version; the pipeline was removed
# 2026-09-22 when Daniel switched the hub to his LaTeX CV.)
#
# Pinned tool versions (verified 2026-09-21 against current releases):
#   actions/checkout ............ v4
#   actions/setup-python ........ v5
#   quarto-dev/quarto-actions ... v2 (Quarto 1.7.32)
#   peaceiris/actions-gh-pages .. v4
#   Python ...................... 3.12

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  QUARTO_VERSION: "1.7.32"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Stage assets for the site
        run: |
          set -euo pipefail
          rm -rf site/assets
          cp -r assets site/assets

      - name: Render the site
        run: quarto render site/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: career-hub-build
          path: |
            assets/cv/*.pdf
            site/_site
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/_site
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ github.sha }}"
